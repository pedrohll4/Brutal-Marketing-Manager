<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1c1c" />
      <stop offset="100%" stop-color="#0e0e0e" />
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7700" />
      <stop offset="100%" stop-color="#FF3300" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded rectangle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" stroke="#333" stroke-width="4" />

  <!-- Outer subtle glow circle -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="#FF5500" stroke-opacity="0.15" stroke-width="8" stroke-dasharray="16 12" />

  <!-- Stylized "B" Brutal Emblem (Futuristic & Geometric) -->
  <g filter="url(#glow)">
    <!-- Vertical Spine -->
    <path d="M140 120 L270 120 C320 120 355 145 355 190 C355 220 335 240 300 250 C345 260 372 285 372 325 C372 375 330 392 270 392 L140 392 Z" fill="none" stroke="url(#orangeGrad)" stroke-width="38" stroke-linejoin="round" stroke-linecap="round" />
    <!-- Horizontal inner divider -->
    <line x1="150" y1="252" x2="300" y2="252" stroke="url(#orangeGrad)" stroke-width="32" stroke-linecap="round" />
    <!-- Center Bolt Accent -->
    <polygon points="260,200 230,260 270,260 240,320 310,240 270,240" fill="#FFF" />
  </g>
</svg>
